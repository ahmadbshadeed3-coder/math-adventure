<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7c3aed">
<title>مغامرة الحساب 🌟</title>
<style>
:root{--purple:#7c3aed;--purple2:#a855f7;--pink:#ec4899;--ink:#24213b;--muted:#77738c;--card:#fff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,#ede9fe 0%,#fce7f3 55%,#e0f2fe 100%);padding:18px;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;border-radius:50%;z-index:-1;opacity:.45}
body:before{width:220px;height:220px;background:#c4b5fd;top:-70px;left:-70px}
body:after{width:180px;height:180px;background:#f9a8d4;bottom:-60px;right:-50px}
.app{width:min(720px,100%);margin:auto}
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:5px 0 16px}
.logo{font-size:28px;font-weight:950}.tag{font-size:13px;color:var(--muted)}
.score{background:#fff;padding:10px 14px;border-radius:18px;font-weight:900;box-shadow:0 8px 24px #00000010}
.panel{background:rgba(255,255,255,.93);border:1px solid #ffffff;border-radius:28px;padding:22px;box-shadow:0 18px 50px #4c1d9518}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 18px}
.level{border:2px solid #e9e5f2;background:#fff;border-radius:17px;padding:12px 8px;font-weight:900;cursor:pointer}
.level.active{border-color:var(--purple);background:#f5f3ff}
.level small{display:block;color:var(--muted);font-weight:600;margin-top:3px}
.stats{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:14px;margin-bottom:8px}
.progress{height:10px;background:#eeeaf7;border-radius:99px;overflow:hidden;margin-bottom:22px}.bar{height:100%;width:10%;background:linear-gradient(90deg,var(--purple),var(--pink));transition:.3s}
.timer{font-weight:900;color:var(--purple);font-size:16px}
.question-box{text-align:center;background:linear-gradient(180deg,#faf8ff,#fff);border:1px solid #eeeafa;border-radius:24px;padding:22px 16px;margin-bottom:15px}
.question{font-size:48px;font-weight:950;letter-spacing:1px;margin:8px 0}
.hint{color:var(--muted);font-size:14px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.option{border:2px solid #e8e5ef;background:#fff;border-radius:19px;padding:17px;font-size:23px;font-weight:950;color:var(--ink);cursor:pointer;box-shadow:0 5px 0 #ebe7f2;transition:.12s}
.option:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #ebe7f2}
.option:disabled{cursor:default}.correct{background:#dcfce7!important;border-color:#22c55e!important;box-shadow:0 4px 0 #86efac!important}.wrong{background:#fee2e2!important;border-color:#ef4444!important;box-shadow:0 4px 0 #fca5a5!important}
.feedback{min-height:34px;text-align:center;font-size:18px;font-weight:900;padding-top:12px}
.next,.restart{width:100%;border:0;border-radius:18px;padding:15px;font-size:17px;font-weight:950;cursor:pointer}
.next{background:linear-gradient(90deg,var(--purple),var(--purple2));color:white;box-shadow:0 7px 16px #7c3aed30}.next:disabled{opacity:.38;cursor:not-allowed}
.restart{margin-top:10px;background:#f3f1f7;color:var(--ink)}
.end{text-align:center;padding:18px 8px}.stars{font-size:44px;letter-spacing:5px}.final{font-size:29px;font-weight:950;margin:6px}.message{color:var(--muted);margin-bottom:16px}
.badge{display:inline-block;background:#fff7ed;border:1px solid #fed7aa;border-radius:99px;padding:7px 12px;font-weight:900;color:#c2410c;margin-bottom:15px}
.hidden{display:none}
.pop{animation:pop .28s ease}@keyframes pop{50%{transform:scale(1.04)}}
@media(max-width:500px){body{padding:12px}.panel{padding:15px;border-radius:22px}.logo{font-size:23px}.question{font-size:40px}.option{font-size:21px;padding:15px}.levels{gap:7px}.level{padding:10px 5px}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div><div class="logo">🌈 مغامرة الحساب</div><div class="tag">حلّي المسائل واجمعي النجوم! ⭐</div></div>
    <div class="score">⭐ <span id="score">0</span></div>
  </div>

  <section class="panel">
    <div class="levels">
      <button class="level active" data-level="easy">🐣 سهل<small>جمع وطرح</small></button>
      <button class="level" data-level="medium">🚀 متوسط<small>أكبر قليلًا</small></button>
      <button class="level" data-level="hard">🦄 تحدّي<small>ضرب أيضًا</small></button>
    </div>

    <div class="stats">
      <span>السؤال <b id="qnum">1</b> / 10</span>
      <span class="timer">⏱️ <b id="time">20</b> ث</span>
    </div>
    <div class="progress"><div class="bar" id="bar"></div></div>

    <div class="question-box">
      <div class="hint">اختاري الإجابة الصحيحة 👇</div>
      <div class="question" id="question">—</div>
    </div>

    <div class="options" id="options"></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <button class="next" id="next" disabled>السؤال التالي ➜</button>
    <button class="restart" id="restart">إعادة اللعب 🔄</button>

    <div class="end hidden" id="end">
      <div class="stars" id="stars">⭐⭐⭐</div>
      <div class="final">انتهت المغامرة! 🎉</div>
      <div class="message" id="message"></div>
      <div class="badge">نتيجتك: <span id="finalScore">0</span> / 10</div>
    </div>
  </section>
</div>

<script>
(()=> {
  const $=id=>document.getElementById(id);
  let level="easy",score=0,q=0,current=null,answered=false,time=20,timer=null;

  const settings={
    easy:{max:10,minus:true,multiply:false,time:20},
    medium:{max:20,minus:true,multiply:false,time:18},
    hard:{max:30,minus:true,multiply:true,time:15}
  };

  function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
  function makeQuestion(){
    const s=settings[level], type=s.multiply?rand(1,3):rand(1,2);
    let a,b,answer,text;
    if(type===1){a=rand(1,s.max);b=rand(1,s.max);text=`${a} + ${b} = ؟`;answer=a+b}
    else if(type===2){a=rand(1,s.max);b=rand(1,a);text=`${a} − ${b} = ؟`;answer=a-b}
    else {a=rand(2,10);b=rand(2,10);text=`${a} × ${b} = ؟`;answer=a*b}
    const vals=new Set([answer]);
    while(vals.size<4){
      let d=rand(1,Math.max(3,Math.min(12,s.max)));
      let v=Math.random()<.5?answer+d:answer-d;
      if(v>=0) vals.add(v);
    }
    return {text,answer,options:[...vals].sort(()=>Math.random()-.5)}
  }

  function startTimer(){
    clearInterval(timer); time=settings[level].time; $("time").textContent=time;
    timer=setInterval(()=>{
      if(answered)return;
      time--; $("time").textContent=time;
      if(time<=0){clearInterval(timer);autoWrong()}
    },1000)
  }

  function autoWrong(){
    if(answered)return; answered=true;
    [...$("options").children].forEach(b=>b.disabled=true);
    const right=[...$("options").children].find(b=>Number(b.textContent)===current.answer);
    if(right)right.classList.add("correct");
    $("feedback").textContent=`انتهى الوقت! ⏰ الإجابة ${current.answer}`;
    $("next").disabled=false;
  }

  function render(){
    clearInterval(timer);
    $("end").classList.add("hidden");
    if(q>=10){finish();return}
    current=makeQuestion(); answered=false;
    $("qnum").textContent=q+1;$("score").textContent=score;
    $("question").textContent=current.text;$("feedback").textContent="";
    $("next").disabled=true;$("bar").style.width=((q+1)*10)+"%";
    $("options").innerHTML="";
    current.options.forEach(v=>{
      const b=document.createElement("button");
      b.type="button";b.className="option";b.textContent=v;
      b.onclick=()=>choose(b,v);$("options").appendChild(b);
    });
    startTimer();
  }

  function choose(btn,v){
    if(answered)return;
    answered=true;clearInterval(timer);
    [...$("options").children].forEach(b=>b.disabled=true);
    if(v===current.answer){
      score++;btn.classList.add("correct");$("feedback").textContent="رائع! إجابة صحيحة 🌟";
      $("score").textContent=score;
    }else{
      btn.classList.add("wrong");
      const right=[...$("options").children].find(b=>Number(b.textContent)===current.answer);
      if(right)right.classList.add("correct");
      $("feedback").textContent=`قريب! الإجابة الصحيحة هي ${current.answer} 💡`;
    }
    $("next").disabled=false;
  }

  function finish(){
    clearInterval(timer);
    $("question").textContent="👏 أحسنتِ!";
    $("options").innerHTML="";$("feedback").textContent="";
    $("next").disabled=true;$("bar").style.width="100%";
    $("end").classList.remove("hidden");
    $("finalScore").textContent=score;
    const stars=score>=9?"⭐⭐⭐":score>=6?"⭐⭐":"⭐";
    $("stars").textContent=stars;
    $("message").textContent=score>=9?"ممتاز جدًا! أنتِ نجمة الحساب ✨":score>=6?"نتيجة جميلة! استمري في التدريب 💪":"محاولة رائعة! جربي مرة أخرى واجمعي نجومًا أكثر 🌈";
  }

  $("next").onclick=()=>{q++;render()};
  $("restart").onclick=()=>{score=0;q=0;render()};
  document.querySelectorAll(".level").forEach(b=>b.onclick=()=>{
    document.querySelectorAll(".level").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");level=b.dataset.level;score=0;q=0;render();
  });
  render();
})();
</script>
</body>
</html>
